<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benimle Evlenir Misin?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('arkaplan.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            position: relative;
            overflow: hidden; 
            transition: all 0.3s ease;
        }

        .card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            color: #d63384;
            font-size: 1.5rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Butonlar arası mesafe artırıldı (yakın olma sorunu çözüldü) */
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #evetBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 2;
            transition: transform 0.2s ease;
        }

        #evetBtn:hover {
            background-color: #ff758c;
            transform: scale(1.05);
        }

        #hayirBtn {
            background-color: #adb5bd;
            color: white;
            /* Absolute kaldırıldı, ilk etapta düzenli yan yana durması sağlandı */
        }
    </style>
</head>
<body>

    <div class="card" id="cardContainer">
        <img id="mainGif" src="ayar.gif" alt="Sevimli Ayılar">
        
        <h1 id="questionText">PANPİS BENNİMLE EVLENİR MİSİN??</h1>
        
        <div class="buttons" id="buttonArea">
            <button id="evetBtn" onclick="kabulEt()">Evet</button>
            <button id="hayirBtn" onmouseover="kacir(event)" ontouchstart="kacir(event)">Hayır</button>
        </div>
    </div>

    <!-- Müzik dosyası -->
    <audio id="sarki" src="sarki.m4a" preload="auto"></audio>

    <script>
        const hayirBtn = document.getElementById('hayirBtn');
        const cardContainer = document.getElementById('cardContainer');
        const mainGif = document.getElementById('mainGif');
        const questionText = document.getElementById('questionText');
        const buttonArea = document.getElementById('buttonArea');
        const sarki = document.getElementById('sarki');

        function kacir(e) {
            if(e) e.preventDefault();

            // Butonun ilk kaçışta absolute konuma geçmesi sağlanır
            if (hayirBtn.style.position !== 'absolute') {
                hayirBtn.style.position = 'absolute';
            }

            // Beyaz kutunun sınırları içinde kalacak güvenli min/max piksel hesaplaması
            const maxX = cardContainer.clientWidth - hayirBtn.offsetWidth - 20;
            const maxY = cardContainer.clientHeight - hayirBtn.offsetHeight - 20;

            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));

            hayirBtn.style.left = randomX + 'px';
            hayirBtn.style.top = randomY + 'px';
        }

        function kabulEt() {
            mainGif.src = 'mutlu.gif';
            questionText.innerHTML = "KABUL EDECEGİNİ BİLİYİRDİM!! 🎉💖";
            buttonArea.style.display = 'none';
            
            sarki.play().catch(error => {
                console.log("Müzik çalınamadı:", error);
            });
        }
    </script>

</body>
</html>
